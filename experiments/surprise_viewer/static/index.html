<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Surprise Heatmap</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>LLM Surprise Heatmap</h1>
            <p>Visualize the "surprise" (negative log-likelihood) of each token as generated by the model.</p>
        </header>

        <main>
            <div class="input-section">
                <textarea id="inputText" placeholder="Enter text to analyze..."></textarea>
                <div class="controls">
                    <button id="analyzeBtn">Analyze Surprise</button>
                    <span id="status" class="status"></span>
                </div>
            </div>

            <div class="output-section">
                <div id="heatmapContainer" class="heatmap-container"></div>
            </div>

            <div class="legend">
                <span>Low Surprise (Predictable)</span>
                <div class="gradient-bar"></div>
                <span>High Surprise (Unexpected)</span>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
